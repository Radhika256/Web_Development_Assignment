<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid Problem-03</title>
    <style>
        body{
            box-sizing: border-box;
        }
        .cont{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            column-gap: 8px;
            width: 500px;
            height: 190px;
            margin:220px 370px;
        }
        .cont>div{
            background-color: rgb(7, 97, 100);
            border:2px solid rgb(7, 97, 100);
            border-radius: 5px;
            color: white;
            display: inline-flex;
            align-items: center;
            font-weight: bold;
            font-size: 25px;
        }
        span{
            margin: 20px 20px;
        }
        .cont>:first-child{
            grid-area: 1/1/2/3;
            height: 89px;
            padding-bottom: 4px;
        }
        .cont>:nth-child(2){
            grid-area: 1/3/3/4;
            align-items: start;
            height: 200px;
        }
        .cont>:nth-child(5){
            grid-area:1/4/3/5;
            align-items: start;
            height: 220px;
        }
        .cont>:nth-child(3){
            height: 87px;
        }
        .cont>:nth-child(4){
            height: 87px;
        }
    </style>
</head>
<body>
    <div class="cont">
            <div><span>A</span></div>
            <div><span>B</span></div>
            <div><span>C</span></div>
            <div><span>D</span></div>
            <div><span>E</span></div>
        </div>
    </div>
</body>
</html>
