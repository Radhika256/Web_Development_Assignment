<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid Problem-06</title>
    <style>
        .box{
            margin: 80px 450px;
            border:2px solid white;
            box-shadow: 2px 2px 4px #999;
            border-radius: 5px;
            height: 500px;
            width: 400px;
        }
        .cont{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap:15px;
            width: 320px;
            height: 400px;
            margin:50px 40px;
        }
        .cont>div{
            background-color: white;
            border:2px solid white;
            box-shadow: 2px 2px 4px #999;
            border-radius: 8px;
            color: black;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
        }
        .cont>:nth-child(1){
            grid-area: 1/1/2/5;
        }
        .cont>:nth-child(5){
            background-color: orange;
        }
        .cont>:nth-child(9){
            background-color: orange;
        }
        .cont>:nth-child(13){
            background-color: orange;
        }
        .cont>:nth-child(16){
            background-color: orange;
        }
        .cont>:nth-child(17){
            background-color: orange;
        }
        .cont>:nth-child(14){
            background-color: rgb(32, 23, 8);
            color: white;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="cont">
            <div class="spc"></div>
            <div class="num">1</div>
            <div class="num">2</div>
            <div class="num">3</div>
            <div class="sign">+</div>
            <div class="num">4</div>
            <div class="num">5</div>
            <div class="num">6</div>
            <div class="sign">-</div>
            <div class="num">7</div>
            <div class="num">8</div>
            <div class="num">9</div>
            <div class="sign">X</div>
            <div class="sign">C</div>
            <div class="num">0</div>
            <div class="sign">=</div>
            <div class="sign">/</div>
        </div>
    </div>
</body>
</html>
