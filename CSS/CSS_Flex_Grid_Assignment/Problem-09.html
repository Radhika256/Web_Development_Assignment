<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid Problem-05</title>
    <style>
        .box{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            row-gap:30px;
            column-gap:30px;
            width: 600px;
            height: 400px;
            margin: 160px 320px;
        }
        .box>div{
            background-color: rgb(52, 169, 173);
            border:2px solid rgb(52, 169, 173);
            border-radius: 5px;
        }
        .box>:nth-child(2){
            grid-area: 1/2/2/4;
        }
        .box>:nth-child(4){
            grid-area: 2/1/3/3;
        }
        .box>:nth-child(9){
            grid-area: 3/3/4/5;
        }
    </style>
</head>
<body>
    <div class="box">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
</body>
</html>
