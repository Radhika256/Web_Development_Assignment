<!DOCTYPE html>
<html lang="en">
<head>
    <title>Keyboard</title>
    <style>
        body{
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        #box{
            background-color: aqua;
            padding: 50px;
            width:850px ;
            margin: 140px 150px;

        }
        .key{
            display: grid;
            grid-template-columns: repeat(12,1fr);  
            gap: 10px;
            border: 2px solid rgb(35, 17, 17) ;
            border-radius: 10px;
            background-color: rgb(35, 17, 17);
            box-shadow: 2px 2px 5px black;
            width: 800px;
            padding: 12px;
        }
        .key>div{
            border: 2px solid rgb(75, 70, 70) ;
            border-radius: 5px;
            background-color: rgb(75, 70, 70);
            box-shadow: 2px 2px 5px black;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            padding: 5px;
            color: aqua;
                }
        .ent{
            grid-area: 3/11/4/13;
        }
        .shi{
            grid-area: 4/11/5/13;
        }
        .spa{
            grid-area: 5/5/6/9;
        }
    </style>
</head>
<body>
    <div id="box">
    <div class="key">
        <div>~</div>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
        <div>6</div>
        <div>7</div>
        <div>8</div>
        <div>9</div>
        <div>0</div>
        <div>delete</div>
        <div>tab</div>
        <div>Q</div>
        <div>W</div>
        <div>E</div>
        <div>R</div>
        <div>T</div>
        <div>Y</div>
        <div>U</div>
        <div>I</div>
        <div>O</div>
        <div>P</div>
        <div>\</div>
        <div>caps</div>
        <div>A</div>
        <div>S</div>
        <div>D</div>
        <div>F</div>
        <div>G</div>
        <div>H</div>
        <div>J</div>
        <div>K</div>
        <div>L</div>
        <div class="ent">Enter</div>
        <div>shift</div>
        <div>Z</div>
        <div>X</div>
        <div>C</div>
        <div>V</div>
        <div>B</div>
        <div>N</div>
        <div>M</div>
        <div><</div>
        <div>></div>
        <div class="shi">Shift</div>
        <div>🪟</div>
        <div>control</div>
        <div>option</div>
        <div>alt</div>
        <div class="spa">Space</div>
        <div>alt</div>
        <div>option</div>
        <div>⬅️</div>
        <div>➡️</div>
    </div></div>
</body>
</html>
