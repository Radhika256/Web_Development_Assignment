<!DOCTYPE html>
<html lang="en">
<head>
    <title>Grid Problem-02</title>
    <style>
        .cont{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            row-gap:8px;
            column-gap: 8px;
            width: 500px;
            height: 190px;
            margin:220px 370px;
        }
        .cont>div{
            background-color: rgb(7, 97, 100);
            border:2px solid rgb(7, 97, 100);
            border-radius: 5px;
            color: white;
            display: inline-flex;
            align-items: center;
            font-weight: bold;
            font-size: 20px;
        }
        .cont>:first-child{
            grid-area: 1/1/2/3;
        }
        .cont>:nth-child(2){
            grid-area: 1/3/2/5;
        }
        .cont>:nth-child(4){
            grid-area: 2/2/3/5;
        }
        .cont>:last-child{
            grid-area: 3/1/4/5;
        }
        span{
            margin: 20px 20px;
        }
    </style>
</head>
<body>
    <div class="cont">
        <div><span>A</span></div>
        <div><span>B</span></div>
        <div><span>C</span></div>
        <div><span>D</span></div>
        <div><span>E</span></div>
    </div>
</body>
</html>
